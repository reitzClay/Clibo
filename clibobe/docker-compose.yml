services:
  # The PostgreSQL Database Engine
  postgres-db:
    image: postgres:16-alpine
    container_name: clibo-postgres
    environment:
      POSTGRES_USER: clibo_user
      POSTGRES_PASSWORD: clibo_pass
      POSTGRES_DB: clibo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clibo_user -d clibo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Your Spring Boot Application Service
  spring-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clibo-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres-db:5432/clibo_db?currentSchema=public}
      - SPRING_DATASOURCE_USERNAME=clibo_user
      - SPRING_DATASOURCE_PASSWORD=clibo_pass
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-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}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-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}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
