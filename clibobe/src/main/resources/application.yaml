spring:
  application:
    name: clibobe

  # Database Connection Details
  datasource:
    url: jdbc:postgresql://localhost:5432/clibo_db
    username: clibo_user
    password: clibo_pass
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # OAuth2 Security Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID:277710406862-m9kf0s96pq1t5dabdes4nsbr1hhd2j5g.apps.googleusercontent.com}"
            client-secret: "${GOOGLE_CLIENT_SECRET:}" # Load securely via environment variable
            scope:
              - profile
              - email

gemini:
  api:
    key: "${GEMINI_API_KEY:}"

ai:
  provider: "${AI_PROVIDER:gemini}"

ollama:
  base:
    url: "${OLLAMA_BASE_URL:http://localhost:11434}"
