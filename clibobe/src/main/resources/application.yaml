spring:
  application:
    name: clibobe

  # Java 21 Project Loom / Virtual Threads Enablement
  threads:
    virtual:
      enabled: true

  # Database Connection Details & Low-Memory Sized Hikari Pool
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clibo_db?currentSchema=public}"
    username: clibo_user
    password: clibo_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  # OAuth2 Security Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID:277710406862-k1h0jcnngg5k64q5semb3pqvs295qe9v.apps.googleusercontent.com}"
            client-secret: "${GOOGLE_CLIENT_SECRET:}" # Load securely via environment variable
            scope:
              - profile
              - email

gemini:
  api:
    key: "${GEMINI_API_KEY:}"

ai:
  provider: "${AI_PROVIDER:gemini}"

ollama:
  base:
    url: "${OLLAMA_BASE_URL:http://localhost:11434}"
